[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Optional-dependency availability probes: the imports intentionally bind
# names that are only used behind `RUST_*_AVAILABLE` guards.
"src/**" = ["F401"]
